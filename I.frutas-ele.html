<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frutas ELE</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
.tile {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 50px;
  height: 50px;
  margin: 5px;
  background: #fed7aa;
  border-radius: 12px;
  font-weight: bold;
  color: #7c2d12;
  font-size: 1.3rem;
}

.card {
  background: white;
  border-radius: 24px;
  padding: 25px;
  margin-bottom: 20px;
  border: 2px solid #ffedd5;
}

.input-ele {
  border: 2px solid #fdba74;
  padding: 12px;
  border-radius: 15px;
  width: 100%;
  font-size: 1.1rem;
  outline: none;
}

.input-ele:disabled {
  background: #f3f4f6;
  color: #6b7280;
}

.hidden { display:none; }
</style>
</head>

<body class="bg-orange-50 p-4 font-sans">

<div class="max-w-2xl mx-auto">

  <h1 class="text-4xl font-bold text-center text-orange-600 mb-6">
    🍎 Ordena las letras
  </h1>

  <p id="alumno" class="text-center mb-4 font-bold text-orange-500"></p>

  <div id="juego"></div>

  <div id="final" class="hidden text-center bg-white p-10 rounded-3xl border-4 border-green-500">
    <h2 class="text-3xl font-bold text-green-700 mb-4">¡Completado!</h2>
    <p id="resultado" class="text-xl mb-6"></p>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <button onclick="reiniciarActividad()" class="bg-orange-500 text-white px-6 py-3 rounded-xl font-bold">
        Jugar de nuevo
      </button>
      <button onclick="volverAlCampus()" class="bg-gray-800 text-white px-6 py-3 rounded-xl font-bold">
        Volver al campus
      </button>
    </div>
  </div>

</div>

<script>
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyt4Bmol2cThS30X6vnvvcem9DKET3wFWxHDi4ggALV2sOqAA8iLCCACsGd_TCk2vpm/exec";

const FRUTAS = [
  { w: "manzana", e: "🍎" },
  { w: "plátano", e: "🍌" },
  { w: "naranja", e: "🍊" },
  { w: "limón", e: "🍋" }
];

const datos = JSON.parse(sessionStorage.getItem("alumnoELE")) || {};
const usuarioActual = datos.usuarioReal || "Anónimo";
const nombreCompleto = `${datos.nombre || ""} ${datos.apellido || ""}`.trim();

document.getElementById("alumno").innerText = `Estudiante: ${nombreCompleto || usuarioActual}`;

// -------- ENVÍO GOOGLE --------
function enviar(payload) {
  return fetch(WEBAPP_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .then(res => {
    console.log("Respuesta Apps Script:", res);
    return res;
  })
  .catch(error => {
    console.error("Error al enviar:", error);
    return { ok: false, error: String(error) };
  });
}

// -------- ESTADO DEL JUEGO --------
let aciertos = 0;
let terminados = 0;
let resueltas = {};
let notaEnviada = false;

// -------- REGISTRO ENTRADA --------
window.onload = async () => {
  await enviar({
    type: "log",
    usuario: usuarioActual,
    actividad: "A1 - Frutas",
    tipo: "Entrada",
    detalle: "Inicio"
  });

  construir();
};

// -------- JUEGO --------
function construir() {
  const cont = document.getElementById("juego");
  cont.innerHTML = "";

  FRUTAS.forEach((f, i) => {
    const mezclada = f.w.split("").sort(() => Math.random() - 0.5).join("");

    cont.innerHTML += `
      <div class="card">
        <div class="text-3xl mb-3">${f.e}</div>

        <div class="mb-4">
          ${mezclada.split("").map(l => `<span class="tile">${l.toUpperCase()}</span>`).join("")}
        </div>

        <div class="flex gap-2">
          <input id="in${i}" class="input-ele" type="text" autocomplete="off" placeholder="Escribe la fruta...">
          <button id="btn${i}" onclick="check(${i})" class="bg-orange-500 text-white px-4 rounded-xl font-bold">OK</button>
        </div>

        <p id="msg${i}" class="mt-2 font-bold"></p>
      </div>
    `;

    const input = document.getElementById(`in${i}`);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        check(i);
      }
    });
  });
}

function check(i) {
  if (resueltas[i]) return;

  const input = document.getElementById("in" + i);
  const btn = document.getElementById("btn" + i);
  const msg = document.getElementById("msg" + i);
  const val = input.value.trim().toLowerCase();

  if (val === FRUTAS[i].w.toLowerCase()) {
    msg.innerText = "✔ Correcto";
    msg.style.color = "green";

    input.disabled = true;
    btn.disabled = true;
    btn.classList.add("opacity-50", "cursor-not-allowed");

    resueltas[i] = true;
    aciertos++;
    terminados++;

    if (terminados === FRUTAS.length) {
      finalizar();
    }
  } else {
    msg.innerText = "❌ Intenta otra vez";
    msg.style.color = "red";
  }
}

// -------- FINAL --------
async function finalizar() {
  const nota = `${aciertos}/${FRUTAS.length}`;

  if (!notaEnviada) {
    notaEnviada = true;

    await enviar({
      type: "nota",
      usuario: usuarioActual,
      actividad: "A1 - Frutas",
      nota: nota,
      detalle: "Resultado final"
    });
  }

  document.getElementById("juego").classList.add("hidden");
  document.getElementById("final").classList.remove("hidden");
  document.getElementById("resultado").innerText = `Has acertado ${nota}`;
}

// -------- VOLVER --------
function volverAlCampus() {
  window.location.href = "index.html";
}

// -------- REINICIAR --------
function reiniciarActividad() {
  aciertos = 0;
  terminados = 0;
  resueltas = {};
  notaEnviada = false;

  document.getElementById("final").classList.add("hidden");
  document.getElementById("juego").classList.remove("hidden");

  construir();
}
</script>

</body>
</html>
